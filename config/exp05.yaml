# =============================================================================
# v5 generation (exp05 / exp05b / exp05c) — full reproducibility snapshot
# =============================================================================
# Entropy-preserving GRPO config + reasoning-aware reward. Qwen3-8B learns
# 9x9 Go from KataGo labels.
#
# STATUS  : COMPLETE. Three runs, one script, one reward module. The first two
#           were killed by bugs, not by the hypothesis:
#             exp05  (W&B tijdgbfj, ~1490 steps) — flat at base level.
#                    Effective step size ~5x too small: scale_rewards="batch"
#                    (~3x) x TRL's sequence_mask vLLM-IS correction (~0.59x).
#             exp05b (~2000 steps) — flat again, but the trainer WAS learning
#                    (‖lora_B‖ 1.05, grad_norm 0.16->0.99). Every rollout and
#                    eval came from the frozen base policy: TRL 1.9.2 bug
#                    trl#5312, sleep-mode reload_weights reloading base
#                    weights from disk each step.
#             exp05c (W&B lc4hyp23, 6000 steps, stopped 2026-08-11) — SUCCESS.
#                    Held-out eval core 0.4853 -> 0.5222, then plateaued.
#           Values below are exp05c's (the config that worked); knobs that
#           changed mid-generation carry their history inline.
# AUTHORITY: this file is a hand-maintained SNAPSHOT for reproduction. No code
#           reads it. The executable source of truth is the CONFIG dict in
#           src/model_training/train_grpo_v5.py (values below are verbatim
#           copies) and the constants in src/model_training/reward_v5.py.
#           If they ever disagree, the scripts win — then fix this file.
# WHY     : docs/adr/0006-entropy-preserving-grpo-config-v5.md — the original
#           rationale plus Amendments 1-5, which root-cause every failure and
#           justify every mid-generation change. Evidence for the exp04
#           diagnosis: notebooks/exp01-04_analysis.ipynb.
# GLOSSARY: CONTEXT.md (experiment vs generation numbering, held-out split,
#           entropy collapse, reasoning reward, ...).
#
# Historical configs quoted in the `changed:` fields below come from the true
# W&B records cached in notebooks/data/run_configs.json — not from memory.
# exp01=hardy-river-3 (v1, Qwen2.5-7B), exp02=true-darkness-4 (v3, dead run),
# exp03=drawn-meadow-5 (v3), exp04=fiery-firebrand-6 (v4, checkpoint-5000).

experiment:
  id: exp05c                # exp05 -> exp05b -> exp05c; see STATUS above
  generation: v5            # dataset schema + reward + training script move together
  wandb_project: brighton_zz-uc-san-diego/huggingface
  wandb_run_name: exp05c-grpo-v5c
  wandb_run_id: lc4hyp23    # one logical run across restarts (WANDB_RESUME=allow)
  # The entity is pinned via WANDB_ENTITY/WANDB_PROJECT in train_grpo_v5.py.
  # Without it the run follows ~/.netrc's default entity — the first exp05
  # launch (2026-08-04, aborted at step ~50) landed in `model-as-memory`
  # instead, invisible alongside exp01-04. The credential is a member of both.
  training_script: src/model_training/train_grpo_v5.py
  reward_module: src/model_training/reward_v5.py     # pure Python, no torch
  reward_unit_tests: src/model_training/test_reward_v5.py   # 33 assertions, CPU-only
  fresh_start: true
  # NOT resumed from v4 checkpoint-5000: that policy is already entropy-collapsed,
  # and the changed reward would make its curve incomparable anyway (ADR 0006).

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  train_file: data/training_data_v5_train.jsonl      # 105,596 rows
  eval_file: data/eval_positions_v5.jsonl            # 502 rows
  produced_by: prepare_v5_split.py
  split_params:
    INPUT_FILE: data/training_data_v4.jsonl          # 113,404 rows (v4 dataset, unchanged)
    EVAL_TARGET: 500                                 # actual: 502 (whole games are atomic)
    SEED: 42
  split_rule: by-source-game
  # The corpus is 16x augmented (D4 symmetries x color swap). A row-wise random
  # split would leak symmetry variants of eval positions into training, so entire
  # source games are held out ("held out by game, evaluated by identity record").
  # exp01-04 had NO held-out eval at all — this is the first run with one.
  row_schema: [original_id, user_prompt, katago_evals, root_winrate, root_scoreLead]
  prompt_token_stats: {min: 350, median: 483, p99: 516, max: 518}  # measured over 3,000 rows, Qwen3 tokenizer

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  base: Qwen/Qwen3-8B
  enable_thinking: false    # ADR 0003 — native <think> blows the 512-token budget
                            # before MOVE: (exp02 died exactly this way)
  lora:                     # unchanged since v3/v4
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  system_prompt: |
    You are a 9x9 Go (Weiqi) player. Board notation: '.' = empty, 'X' = Black, 'O' = White. Columns: A-J (no I). Rows: 1 (bottom) to 9 (top). You MUST only play on an empty '.' intersection listed in the valid coordinates.

    Respond in exactly this format:
    REASONING: [2-4 sentences analyzing the position]
    MOVE: [coordinate, e.g. D4]

# -----------------------------------------------------------------------------
# GRPOConfig (TRL 1.9.2) — verbatim from train_grpo_v5.py CONFIG
# `changed:` notes the exp04 value (the last completed run) unless stated.
# -----------------------------------------------------------------------------
grpo_config:
  output_dir: runs/Qwen3-8B-GRPO-Go-Pro-v5c
  # The dead runs left runs/...-v5/checkpoint-{500,1000} and
  # runs/...-v5b/checkpoint-{500,1000,1500}; kept as evidence.
  run_name: exp05c-grpo-v5c

  # -- schedule ---------------------------------------------------------------
  learning_rate: 2.0e-6
  # changed: exp01-04 all used 5e-6. exp04's own curve shows all effective
  # learning happened while warmup LR was still below ~2e-6, and late-run
  # grad_norm rose 0.2 -> 0.7 (instability at higher LR).
  lr_scheduler_type: constant_with_warmup     # same type as exp02-04
  warmup_steps: 100
  # changed: exp02-04 used warmup_ratio=0.02 OF max_steps=270000 = 5,400 warmup
  # steps, so exp04 (5,220 steps) NEVER LEFT WARMUP. Absolute steps fix that bug.
  max_steps: 10000
  # changed: exp02-04 set 270000 as an aspirational ceiling; 10,000 is a real
  # horizon (~5.5 days measured) paired with the stopping rule below.
  adam_beta1: 0.9                              # unchanged
  adam_beta2: 0.99                             # unchanged
  weight_decay: 0.1                            # unchanged
  bf16: true                                   # unchanged

  # -- batch geometry ---------------------------------------------------------
  per_device_train_batch_size: 16              # unchanged from exp03/04
  num_generations: 16
  # changed: exp01-04 used 8. 16 halves the chance a whole group picks the same
  # move (the tie -> zero-variance -> zero-gradient failure), and steadies the
  # advantage estimate.
  gradient_accumulation_steps: 8
  # changed: exp04 used 4. Together: 128 completions per optimizer step
  # (8 prompt-groups x 16 generations), ~78 GB peak on the 98 GB GPU.
  # GRPO shape constraint: num_generations must divide evenly into the
  # effective batch — never tune these three numbers independently.
  max_completion_length: 512                   # unchanged from exp04 (v4 reclaimed it)

  # -- entropy-preservation package (the heart of exp05) ----------------------
  temperature: 1.15
  # changed: exp01-04 ran the silent TRL default 1.0. ProRL-style rollout
  # diversity: 16 samples collide on one move less often.
  epsilon: 0.2                                 # unchanged (lower clip bound)
  epsilon_high: 0.28
  # changed: exp01-04 had symmetric clipping (epsilon_high unset -> 0.2).
  # DAPO "clip-higher": raises the ceiling so rare-but-good exploratory tokens
  # can actually be reinforced.
  scale_rewards: group
  # exp05 used "batch" (Lite PPO: global normalization instead of the per-group
  # std that AMPLIFIES nearly-tied groups). REVERTED in exp05b: dividing by the
  # batch-wide std (~0.4) instead of the per-group std shrank advantages ~3x,
  # and together with the IS tax below made the run ~5x too slow to learn
  # inside its own horizon (ADR 0006 Amendment 2). Back to exp01-04's value —
  # the megaphone effect is real but the dedup term already suppresses
  # degenerate groups, and 3x of gradient matters more.
  vllm_importance_sampling_mode: token_truncate
  # changed in exp05b: TRL's default "sequence_mask" multiplies each sequence's
  # loss by exp(sum of per-token trainer-vs-vLLM logp diffs). A harmless
  # ~-0.006/token kernel mismatch over ~90 tokens compounds to a flat x0.59 tax
  # on EVERY gradient (visible as a constant 0.59 importance_sampling_ratio).
  # Token-level truncation keeps the correction (~0.994/token) without the
  # sequence-product amplification. exp05c ran at ~0.99 throughout.
  loss_type: dapo
  # unchanged in value — but exp01-04 inherited it as a silent TRL default;
  # v5 states it explicitly as a conscious choice.
  beta: 0.0
  # unchanged in value — explicit now. KL anchor + reference resets are the
  # designated exp06 escalation (full ProRL recipe) if v5 still collapses.
  use_adaptive_entropy: true
  entropy_target: 0.5
  entropy_coef: 0.01
  entropy_coef_delta: 0.005
  # changed: no entropy control existed in exp01-04. Skywork-OR1-style
  # thermostat: pushes entropy toward 0.5 (exp04's healthy early value was
  # ~0.55; it collapsed to 0.31). Requires TRL >= 1.8.
  # Smoke observation: coef auto-decayed 0.005 -> 0 while entropy sat at ~0.65
  # (above target) — the controller works in both directions.
  # exp05c outcome: entropy never fell to the 0.5 target on its own (held
  # 0.52-0.55 for 6,000 steps), so entropy_coef sat at ~0 essentially the whole
  # run. The thermostat never had to act — which means the anti-collapse result
  # is attributable to the OTHER three levers (epsilon_high, temperature,
  # num_generations=16), not to adaptive entropy. Worth isolating in exp06.

  # -- evaluation (first run to have any) -------------------------------------
  eval_strategy: steps
  eval_steps: 500                              # ~68 min per full 502-position eval
  per_device_eval_batch_size: 16

  # -- logging / checkpoints --------------------------------------------------
  logging_steps: 10
  save_steps: 200                              # SEE WARNING — effective value was 500
  # The script sets 200 (exp02-04 and exp05/05b used 500). Rationale: a crash
  # costs up to save_steps of progress, and exp05c's second crash came 3.6 h in
  # while checkpoints were 5.3 h apart, rolling the run back from step 1834 to
  # 1500 — a run whose checkpoint interval exceeds its crash interval can
  # livelock forever without ever saving.
  # WARNING: the change did NOT take effect for exp05c, which resumed from a
  # checkpoint written under 500. transformers' DefaultFlowCallback reads
  # state.save_steps (trainer_callback.py:586), and TrainerState.load_from_json()
  # restores the OLD value from the checkpoint, silently overriding
  # args.save_steps. Checkpoints stayed 500 apart. Changing save_steps /
  # eval_steps / logging_steps only takes effect on a FRESH run.
  save_total_limit: 6                          # /home budget; ~512 MB per LoRA ckpt
  report_to: wandb
  resume: RESUME_FROM=auto                     # env var; newest ckpt in output_dir
  # Added after exp05c's first crash: trainer.train() took no arguments and
  # could not continue a crashed run at all.

  # -- throughput -------------------------------------------------------------
  use_vllm: true
  # changed: exp01-04 generated in-process (use_vllm=False). Colocate mode,
  # measured ~40 s/step at full batch geometry. Fallback if vLLM breaks:
  # set USE_VLLM=False at the top of train_grpo_v5.py (est. 10-12 days).
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.2
  vllm_max_model_length: 1280
  # Without this cap vLLM sizes its KV cache for Qwen3's native 40,960-token
  # window and refuses to start inside the 0.2 memory budget. Measured need:
  # prompt <= 518 tokens + 512 completion = 1,030.
  vllm_enable_sleep_mode: false
  # exp05/05b ran with true. Disabled 2026-08-09 (ADR 0006 Amendment 5) after
  # crash #2: `CUDA Error: out of memory at cumem_allocator.cpp:163` inside
  # sync_weights() -> llm.wake_up(). Sleep level 2 discards vLLM's weights, so
  # every wake must re-map ~16 GB of PHYSICAL memory while torch holds nearly
  # the whole card (measured 62.7 GiB allocated vs 85.4 GiB reserved — a
  # 22.7 GiB fragmentation gap). With sleep off, vLLM allocates once at init
  # and never re-maps: that failure mode is gone, and so is trl#5312 (both it
  # and TRL's buggy reload_weights sit behind the same enable_sleep_mode
  # guard). 12-step smoke: IS ratio 0.9995 vs 0.992, 36.7 s/step vs 38.4.
  # Cost: steady-state GPU memory 48.6 GB -> 88.7 GB of 97.9 GB (90.6%).
  # Shared server — coordinate. Levers if a co-tenant needs the room:
  # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True first, then
  # vllm_gpu_memory_utilization below 0.2 (tight: 8B weights alone need ~16 GB).

# -----------------------------------------------------------------------------
# Reward stack — three scored layers + one non-scoring logger, summed by TRL.
# Constants verbatim from reward_v5.py; tests in test_reward_v5.py.
# -----------------------------------------------------------------------------
reward:
  gate:                                        # unchanged since v4
    no_move_parsed: -1.0
    illegal_coordinate: -0.5                   # also: malformed board -0.1..-0.8 internals
    legal_on_empty: 0.0
    # Graded (not binary) because a binary gate gives no gradient early on.
  core:                                        # unchanged since v4
    formula: w_policy * R_policy_log + w_rank * R_rank
    R_policy_log: "clip((log10(policy)+4)/4, 0, 1)"     # KataGo prior, log-scaled
    R_rank: "1 - rank/(n-1) by scoreLead over evaluated legal moves"
    adaptive_weights:
      closeness: "1 - 2*|root_winrate - 0.5|"
      w_rank: "0.5 + 0.3*closeness"            # balanced positions lean on rank
      w_policy: "1 - w_rank"                   # decided positions lean on prior
  reasoning_layer:                             # NEW in v5 — range [-0.2, +0.05]
    # Zeroed whenever the gate already failed (no double-counting).
    # Capped well under the core signal so it can never outbid move quality.
    consistency_bonus: +0.05                   # chosen coordinate named in REASONING
    length_window:
      full_credit_chars: 200                   # exp04 collapsed to ~100 chars
      max_penalty: -0.10                       # linear below 200; NO bonus above
      # (v1's version PAID for length 50-800 chars -> padding incentive; v5 only
      # punishes shortness, so padding buys nothing.)
    group_dedup:
      bigram_jaccard_threshold: 0.35           # same-position reasoning overlaps legitimately
      max_penalty: -0.10                       # linear in excess overlap vs group siblings
      # Dual role: diversity pressure on the prose AND tie-breaker that revives
      # zero-variance groups when all 16 generations pick the same move.
  logging:
    file: src/model_training/logs/grpo_training_rollouts_v5c.jsonl   # v5/v5b for the dead runs
    samples: 1 per reward batch, full reward breakdown per sample
  # Expectation management (ADR 0006 amendment, from re-examining exp01):
  # exp01's v1 consistency+length term was never gamed, and length held up —
  # but boilerplate happened anyway. So: length window prevents LENGTH collapse,
  # not boilerplate; group_dedup is the only NEW bet against boilerplate;
  # consistency is a cheap tie-breaker with a known, monitored loophole
  # (coordinate listing — never observed, watch the rollout log).

# -----------------------------------------------------------------------------
# Environment — every pin here is load-bearing; see Dockerfile comments.
# -----------------------------------------------------------------------------
environment:
  host:
    server: yumingz5-linux-ml (account tyliu, no sudo, shared GPU)
    gpu: NVIDIA RTX PRO 6000 Blackwell Workstation Edition, 98 GB, sm_120
    driver: 570.211.01                         # CUDA 12.8 ceiling — the root constraint
  image:
    tag: katago-llm                            # built from repo-root Dockerfile
    base: pytorch/pytorch:2.8.0-cuda12.9-cudnn9-devel
    torch: 2.11.0+cu129                        # pip, index download.pytorch.org/whl/cu129
    vllm: 0.25.1+cu129                         # GitHub release wheel (PyPI wheel is cu130)
    trl: 1.9.2                                 # WITHOUT [vllm] extra (see Dockerfile 7b)
    flash_attn: none                           # deliberately absent, see below
  constraint_chain:
    # Driver 570 (CUDA 12.8) + no sudo forces everything else:
    # 1. cu130 wheels cannot initialize on a 12.8 driver -> use cu129 builds
    #    (CUDA 12.x minor-version compatibility covers 12.9-on-12.8).
    # 2. vLLM's bundled flash-attention ships PTX-only sm_120 kernels; PTX JIT
    #    needs driver >= toolchain (12.9) -> permanently unusable here ->
    #    train_grpo_v5.py monkey-patches attention_backend=FLASHINFER into
    #    TRL's LLM constructor (TRL 1.9.2 has no passthrough kwarg; the
    #    VLLM_ATTENTION_BACKEND env var no longer exists in vLLM 0.25.1).
    # 3. flashinfer JIT-compiles sm_120 SASS in userspace but demands
    #    container nvcc >= 12.9 -> hence the CUDA 12.9 base image.
  run_mounts:
    workspace: /home/tyliu/katago_workspace -> /workspace
    hf_cache: /home/tyliu/hf_cache_docker -> /root/.cache/huggingface   # holds Qwen3-8B
    flashinfer_cache: /home/tyliu/flashinfer_cache_docker -> /root/.cache/flashinfer
    wandb_creds: /home/tyliu/.netrc -> /root/.netrc (ro)
  disk:
    "/": docker images + build cache (166 GB, tight — prune build cache after builds)
    "/home": datasets, checkpoints, HF cache (887 GB)

# -----------------------------------------------------------------------------
# Launch (verbatim)
# -----------------------------------------------------------------------------
launch: |
  mkdir -p /home/tyliu/flashinfer_cache_docker
  docker run -d --name exp05 --gpus all \
    -v /home/tyliu/katago_workspace:/workspace -w /workspace \
    -v /home/tyliu/hf_cache_docker:/root/.cache/huggingface \
    -v /home/tyliu/flashinfer_cache_docker:/root/.cache/flashinfer \
    -v /home/tyliu/.netrc:/root/.netrc:ro \
    katago-llm sleep infinity
  docker exec -it exp05 bash
  tmux new -s exp05c
  # ALWAYS through the wrapper on a multi-day run — random C-extension crashes
  # are expected (exp05c crash #1: Fatal Python error: none_dealloc at step
  # 1616, a refcount bug in one of vLLM/FlashInfer/Triton/numba). The wrapper
  # resumes from the newest checkpoint, keeps one continuous W&B curve, and
  # aborts instead of restart-looping on a genuinely broken config.
  WANDB_RUN_ID=lc4hyp23 WANDB_RESUME=allow \
    bash src/model_training/run_with_restart.sh
  # detach with Ctrl-B then D (typing `exit` destroys the tmux session)
  # reattach: docker exec -it exp05 bash && tmux attach -t exp05c

# -----------------------------------------------------------------------------
# Monitoring, stopping, success criteria
# -----------------------------------------------------------------------------
protocol:
  timing: ~36.7 s/step (sleep mode off); ~30 min per full 502-position eval
  stopping_rule: eval reward flat for 4 consecutive evals (2,000 steps) -> stop manually
  # CAVEAT learned the hard way: this rule assumes "learned, then plateaued".
  # A curve that is flat FROM STEP 0 is a bug, not a plateau — triage it with
  # the recipe in CLAUDE.md Pitfalls ("the flatline family") instead of burning
  # 2,000 steps waiting. exp05 and exp05b each cost ~1,500-2,000 wasted steps
  # to that misreading.
  # frac_reward_zero_std < 15%: retracted 2026-08-04 (unmeasurable under
  # scale_rewards="batch", which makes it a batch-wide all-or-nothing flag),
  # REINSTATED for exp05b/05c with the return to "group". exp05c MISSED it —
  # see results below.
  health_criteria:
    - entropy holds near the 0.5 target (no sustained decline)   # primary
    - rewards/reasoning_quality_reward_func/mean does not slide toward -0.2
      # the dedup term IS a within-group similarity measure -> diversity proxy
    - completions/mean_length holds ~80-100 tok (exp04 collapsed 90 -> 43)
    - grad_norm steady (exp04 drifted 0.2 -> 0.7 at lr 5e-6)
  soft_success_criterion: spot-read rollouts reference the actual position, not templates
  watch_for:                                   # known-gameable terms (never yet observed)
    - coordinate listing to farm the consistency bonus
    - template rotation to dodge the group-dedup penalty
  post_run: GTP-proxy matches vs base model (deployment pipeline, project docs)

# -----------------------------------------------------------------------------
# Results — exp05c, 6,000 steps, stopped 2026-08-11 (converged)
# Source: runs/Qwen3-8B-GRPO-Go-Pro-v5c/checkpoint-6000/trainer_state.json
# -----------------------------------------------------------------------------
results:
  held_out_eval_core:          # eval_rewards/katago_composite_reward_func/mean
    step_500: 0.4853
    step_1000: 0.5030
    step_2000: 0.5095
    step_3000: 0.5112
    step_4000: 0.5124
    step_5000: 0.5222          # BEST — use this checkpoint, not the last one
    step_5500: 0.5216
    step_6000: 0.5211
  best_checkpoint: runs/Qwen3-8B-GRPO-Go-Pro-v5c/checkpoint-5000
  train_core: 0.401 -> 0.515   # ~1.5x exp04's rate over the comparable span
  convergence: |
    Gain rate fell ~7x: +0.024 over steps 500-2000 vs +0.0033 over 4500-6000,
    with the last three evals flat-to-slightly-down. Stopped one eval short of
    the formal 4-eval rule; the trend was unambiguous.
  verdict_on_the_hypothesis: |
    CONFIRMED. exp04's failure was one mechanism (entropy 0.55->0.31 ==
    length 90->43 == 61% zero-gradient groups). exp05c held entropy ~0.53 and
    length ~88-95 for 6,000 steps WHILE still learning. Anti-collapse does not
    cost learning signal — the open question from the original ADR.
  open_problems:
    frac_reward_zero_std: |
      Climbed 0.17 -> 0.53 monotonically and never stopped, blowing past the
      <15% criterion and exp04's ~29%. But entropy and length are flat, so this
      is NOT exp04's collapse: the policy has converged to one move in most
      positions and all 16 generations tie. Same phenomenon as the eval
      plateau, seen from the gradient side.
    dedup_term_never_fired: |
      rewards/reasoning_quality_reward_func/mean sat at 0.0499 -> 0.0500 with
      std 0.0011 -> 0.0002 for the whole run. The ceiling is +0.05, so EVERY
      generation earned full marks: the length penalty and the group-dedup
      penalty never triggered once. Yet 400 sampled rollouts had only 133
      unique 6-word openings, with "The current position shows a complex"
      repeated 67x. bigram_jaccard_threshold=0.35 is far too lax.
      Consequence: the mechanism ADR 0006 designated as THE ONLY NEW BET
      against boilerplate — and the tie-breaker meant to revive zero-variance
      groups — was inert, which plausibly explains the item above.
  exp06_leads:
    - Measure the actual bigram-Jaccard distribution across sibling generations
      and set the threshold from data. Most concrete lever available.
    - Isolate which anti-collapse lever did the work (adaptive entropy never
      engaged — see entropy notes above).
    - KataGo top-k precision term on the reasoning text (ADR 0006 amendment).
    - Full ProRL recipe (KL beta=0.001 + periodic reference reset,
      epsilon_high=0.4, temp 1.2) remains the escalation if collapse returns.
    - Have logging_reward_func compute per-group reward std itself, so the
      metric stops depending on scale_rewards (ADR 0006 Correction).

# -----------------------------------------------------------------------------
# Delta summary vs previous experiments (one glance)
# -----------------------------------------------------------------------------
# knob                        exp01      exp02/03       exp04        exp05c
# model                       Qwen2.5-7B Qwen3-8B       Qwen3-8B     Qwen3-8B
# learning_rate               5e-6       5e-6           5e-6         2e-6
# scheduler                   cosine     const+warmup   const+warmup const+warmup
# warmup                      ratio 0.1  ratio 0.02(!)  ratio 0.02(!) 100 steps abs
# max_steps                   1,000      270,000        270,000      10,000 (real)
# num_generations             8          8              8            16
# grad_accum                  2          2 / 4          4            8
# completions per step        16         16 / 64        64           128
# max_completion_length       1024       512 / 1024     512          512
# temperature                 1.0*       1.0*           1.0*         1.15
# epsilon_high                none*      none*          none*        0.28
# scale_rewards               group*     group*         group*       group (exp05: batch)
# vllm IS mode                n/a        n/a            n/a          token_truncate
# adaptive entropy            no         no             no           yes (never engaged)
# reward: reasoning text      v1 length+consistency  none  none      v5 3-term layer
# held-out eval               none       none           none         502 pos / 500 steps
# generation backend          in-process in-process     in-process   vLLM colocate, no sleep
#   (* = silent TRL default, never consciously chosen before exp05)
#
# Outcome, scale-free: exp04 entropy 0.55->0.31, length 90->43, zero-grad 61%.
# exp05c entropy ~0.53 flat, length ~88-95 flat, zero-grad 17%->53%,
# held-out eval core 0.4853->0.5222.
