# =========================================================
# KataGo Config - 9x9 Specialized Mode (Fixed v2)
# =========================================================

# [模型路径] 
# 请务必确认你的 KataGo_engine 文件夹里有这个文件！
# (如果你还没下载或重命名 9x9 模型，这里会报错)
model = C:\git_repo\KataGo-LLM-Team\KataGo_engine\KataGo18b9x9.gz

# --- [修复核心报错] ---
# 这就是导致刚才报错缺失的参数。
# 它决定了 KataGo 同时处理多少个分析请求。
numAnalysisThreads = 12

# --- 性能调整 (9x9 专用) ---
# 9路棋盘计算量小，6个搜索线程足够跑满显卡效率
numSearchThreads = 6

# [思考深度]
# 500 visits 配合 9路棋盘，棋力已经远超人类顶尖
maxVisits = 500

# 批处理大小 (RTX 4060 Laptop 推荐)
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 16

# --- 必须的设置 ---
useNHWC = auto
reportAnalysisWinratesAs = SIDETOMOVE

# [LLM 学习关键] 变图长度
# 输出 15 手的后续变化，让 LLM 学会“计算”
analysisPVLen = 15